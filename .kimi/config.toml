# Scholar's Tea — Kimi Code CLI Project Configuration
# Token-optimized for Next.js + TypeScript + Prisma stack
# Updated: 2026-05-06 — removed defunct bash hooks, kept loop control

# ---------------------------------------------------------------------------
# Loop Control — aggressive context compaction to prevent bloat
# ---------------------------------------------------------------------------
[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 3
max_ralph_iterations = 0
reserved_context_size = 40000
compaction_trigger_ratio = 0.80

# ---------------------------------------------------------------------------
# Background Tasks
# ---------------------------------------------------------------------------
[background]
max_running_tasks = 4
keep_alive_on_exit = false
agent_task_timeout_s = 900

# ---------------------------------------------------------------------------
# MCP Client
# ---------------------------------------------------------------------------
[mcp.client]
tool_call_timeout_ms = 60000

# ---------------------------------------------------------------------------
