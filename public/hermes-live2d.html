<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Live2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    canvas {
      display: block;
    }
    #debug-overlay {
      display: none;
      position: fixed;
      top: 4px;
      left: 4px;
      z-index: 9999;
      font-size: 10px;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      white-space: pre-wrap;
      max-width: 90%;
      padding: 6px 8px;
      border-radius: 4px;
      font-family: monospace;
      line-height: 1.4;
      pointer-events: none;
    }
  </style>
  <script src="/live2dcubismcore.min.js" defer></script>
  <script src="/lib/pixi6.min.js" defer></script>
  <script src="/lib/cubism4-v4.min.js" defer></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="debug-overlay">Loading...</div>
  <script>
    (function() {
      const container = document.getElementById('canvas-container')
      const debugEl = document.getElementById('debug-overlay')
      const urlParams = new URLSearchParams(window.location.search)
      const size = parseInt(urlParams.get('size')) || 64

      function log(msg) {
        debugEl.textContent += '\n' + msg
        console.log(msg)
      }

      /* ============ Motion 映射 ============
         充分利用 wanko 模型的全部 7 个 motion group：
         Idle(3), Flick3(2), Shake(1), FlickUp(1), Tap(2), Flick(2), FlickLeft(1)
      */
      const moodToMotion = {
        idle: 'Idle',
        studying: 'Idle',
        tea_time: 'Idle',
        tea_sipping: 'Idle',
        happy: 'Flick3',
        dancing: 'Flick3',
        eureka: 'FlickUp',
        inspired: 'Flick',
        waving: 'Tap',
        surprised: 'Shake',
        thinking: 'Flick',
        confused: 'Idle',
        curious: 'FlickLeft',
        insight: 'FlickUp',
        love: 'Tap',
        angry: 'Shake',
        debate: 'Shake',
        sleepy: 'Idle',
        bored: 'Idle',
        shy: 'Tap',
        dizzy: 'Shake',
      }

      /* ============ 表情参数引擎 ============
         每个表情定义：
         - eyeBlink: 是否保留自动眨眼（false = 禁用，用于需要固定眼型的表情）
         - fn(t, core): 参数覆盖函数，t 是时间（帧），core 是 CubismCoreModel
      */
      const expressions = {
        // 困惑 — 歪头、半闭眼、垂耳、微张嘴
        confused: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t) * 12)
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.25)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.25)
            core.setParameterValueById('PARAM_EAR_L', -0.4)
            core.setParameterValueById('PARAM_EAR_R', -0.4)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.06)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
          }
        },
        // 困倦/无聊 — 几乎闭眼、垂耳、头低下、微张嘴
        sleepy: {
          eyeBlink: false,
          fn: function(t, core) {
            const blink = Math.sin(t * 0.5) * 0.04
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.1 + blink)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.1 + blink)
            core.setParameterValueById('PARAM_EAR_L', -0.3)
            core.setParameterValueById('PARAM_EAR_R', -0.3)
            core.setParameterValueById('PARAM_ANGLE_Y', 10)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.04)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
          }
        },
        // 开心 — 大眼、竖耳、张嘴笑、轻摇头
        happy: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 1.0)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 1.0)
            core.setParameterValueById('PARAM_EAR_L', 0.5 + Math.sin(t * 3) * 0.15)
            core.setParameterValueById('PARAM_EAR_R', 0.5 + Math.cos(t * 3) * 0.15)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.3)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.0)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 2) * 5)
          }
        },
        // 发现/灵感 — 抬头、大眼、竖耳、O型嘴
        eureka: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 1.0)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 1.0)
            core.setParameterValueById('PARAM_EAR_L', 0.8)
            core.setParameterValueById('PARAM_EAR_R', 0.8)
            core.setParameterValueById('PARAM_ANGLE_Y', -6)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.35)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
          }
        },
        // 灵感（inspired）— 侧头、亮眼睛、竖耳
        inspired: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 1.0)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 1.0)
            core.setParameterValueById('PARAM_EAR_L', 0.4)
            core.setParameterValueById('PARAM_EAR_R', 0.4)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.2)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.0)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 1.5) * 8)
          }
        },
        // 惊讶 — 瞪大眼、竖直耳、张大嘴、头仰起
        surprised: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 1.0)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 1.0)
            core.setParameterValueById('PARAM_EAR_L', 0.9)
            core.setParameterValueById('PARAM_EAR_R', 0.9)
            core.setParameterValueById('PARAM_ANGLE_Y', -5)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.5)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 4) * 3)
          }
        },
        // 思考 — 眯眼、不对称耳朵、慢速歪头、抿嘴
        thinking: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.6)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.6)
            core.setParameterValueById('PARAM_EAR_L', 0.3)
            core.setParameterValueById('PARAM_EAR_R', -0.2)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.05)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 0.5) * 6)
          }
        },
        // 好奇 — 向左看、睁大眼、竖耳
        curious: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.9)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.9)
            core.setParameterValueById('PARAM_EAR_L', 0.6)
            core.setParameterValueById('PARAM_EAR_R', 0.6)
            core.setParameterValueById('PARAM_ANGLE_X', -12)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.1)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.3)
          }
        },
        // 洞察 — 抬头专注、竖耳
        insight: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.9)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.9)
            core.setParameterValueById('PARAM_EAR_L', 0.5)
            core.setParameterValueById('PARAM_EAR_R', 0.5)
            core.setParameterValueById('PARAM_ANGLE_Y', -4)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.08)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
          }
        },
        // 爱心/害羞 — 脸红、温柔眼、微竖耳、小嘴微笑
        love: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_TERE', 1.0)
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.7)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.7)
            core.setParameterValueById('PARAM_EAR_L', 0.3)
            core.setParameterValueById('PARAM_EAR_R', 0.3)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.1)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.2)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 1) * 3)
          }
        },
        // 生气/辩论 — 瞪眼、竖耳、怒嘴、快速摇头
        angry: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.9)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.9)
            core.setParameterValueById('PARAM_EAR_L', 0.6)
            core.setParameterValueById('PARAM_EAR_R', 0.6)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.25)
            core.setParameterValueById('PARAM_MOUTH_FORM', 1.0)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 3) * 8)
          }
        },
        // 喝茶 — 享受闭眼、放松耳、蒸汽、头微仰
        tea: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.4)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.4)
            core.setParameterValueById('PARAM_EAR_L', 0.15)
            core.setParameterValueById('PARAM_EAR_R', 0.15)
            core.setParameterValueById('PARAM_ANGLE_Y', -3)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.12)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.3)
            core.setParameterValueById('PARAM_YUGE_01', 1.0)
            core.setParameterValueById('PARAM_YUGE_02', 1.0)
          }
        },
        // 学习 — 专注、半睁眼、微竖耳
        studying: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.75)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.75)
            core.setParameterValueById('PARAM_EAR_L', 0.15)
            core.setParameterValueById('PARAM_EAR_R', 0.15)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.05)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 0.3) * 3)
          }
        },
        // 挥手 — 正常眼、微动耳
        waving: {
          eyeBlink: true,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.85)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.85)
            core.setParameterValueById('PARAM_EAR_L', Math.sin(t * 2) * 0.2)
            core.setParameterValueById('PARAM_EAR_R', Math.cos(t * 2) * 0.2)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.15)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.0)
          }
        },
        // 头晕 — 半闭眼、垂耳、快速旋转感
        dizzy: {
          eyeBlink: false,
          fn: function(t, core) {
            core.setParameterValueById('PARAM_EYE_L_OPEN', 0.3)
            core.setParameterValueById('PARAM_EYE_R_OPEN', 0.3)
            core.setParameterValueById('PARAM_EAR_L', -0.2)
            core.setParameterValueById('PARAM_EAR_R', -0.2)
            core.setParameterValueById('PARAM_ANGLE_Z', Math.sin(t * 5) * 10)
            core.setParameterValueById('PARAM_MOUTH_OPEN_Y', 0.08)
            core.setParameterValueById('PARAM_MOUTH_FORM', 0.5)
          }
        },
      }

      // mood → expression 映射（哪些 mood 激活哪些表情）
      const moodToExpression = {
        confused: 'confused',
        sleepy: 'sleepy',
        bored: 'sleepy',
        happy: 'happy',
        dancing: 'happy',
        eureka: 'eureka',
        inspired: 'inspired',
        surprised: 'surprised',
        thinking: 'thinking',
        love: 'love',
        shy: 'love',
        angry: 'angry',
        debate: 'angry',
        curious: 'curious',
        insight: 'insight',
        tea_time: 'tea',
        tea_sipping: 'tea',
        studying: 'studying',
        waving: 'waving',
        dizzy: 'dizzy',
      }

      let model = null
      window.l2dModel = model
      let currentMood = 'idle'
      let app = null
      window.l2dApp = app

      /* ============ 通用表情引擎 ============ */
      let activeExpression = null
      let expressionTime = 0
      let expressionUpdateFn = null
      let originalUpdateFn = null

      function startExpression(name) {
        if (!model || !expressions[name]) return
        stopExpression()
        const expr = expressions[name]
        activeExpression = name
        expressionTime = 0
        const im = model.internalModel
        originalUpdateFn = im.update.bind(im)
        expressionUpdateFn = function(dt, et) {
          originalUpdateFn(dt, et)
          expressionTime += 0.03
          expr.fn(expressionTime, im.coreModel)
        }
        if (!expr.eyeBlink && im.eyeBlink) {
          im.eyeBlink._parameterIds = []
        }
        im.update = expressionUpdateFn
        console.log('[Live2D] Expression started: ' + name)
      }

      function stopExpression() {
        if (expressionUpdateFn && originalUpdateFn && model) {
          model.internalModel.update = originalUpdateFn
          if (model.internalModel.eyeBlink) {
            model.internalModel.eyeBlink._parameterIds = ['PARAM_EYE_L_OPEN', 'PARAM_EYE_R_OPEN']
          }
          console.log('[Live2D] Expression stopped: ' + activeExpression)
          expressionUpdateFn = null
          originalUpdateFn = null
          activeExpression = null
        }
      }

      function playMood(moodName) {
        if (!model) return
        const group = moodToMotion[moodName] || 'Idle'
        model.motion(group, undefined, window.PIXI.live2d.MotionPriority.NORMAL).catch(() => {})

        const exprName = moodToExpression[moodName]
        if (exprName) {
          startExpression(exprName)
        } else {
          stopExpression()
        }
      }

      async function init() {
        if (!window.PIXI || !window.PIXI.live2d) {
          log('Waiting for Pixi...')
          setTimeout(init, 200)
          return
        }

        const PIXI = window.PIXI
        const { Live2DModel, MotionPriority } = PIXI.live2d
        log('Pixi v' + PIXI.VERSION)
        log('Live2D plugin: ' + !!PIXI.live2d)

        app = new PIXI.Application({
          width: size,
          height: size,
          backgroundAlpha: 0,
          antialias: true,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
        })
        window.l2dApp = app
        log('Canvas: ' + app.view.width + 'x' + app.view.height)
        container.appendChild(app.view)

        // Click / double-click detection on canvas
        let lastClickTime = 0
        let clickTimer = null
        const DOUBLE_CLICK_DELAY = 300

        function sendTap() {
          window.parent.postMessage({ type: 'hermes-tap' }, '*')
          if (model) {
            model.motion('Tap', undefined, window.PIXI.live2d.MotionPriority.NORMAL).catch(() => {})
          }
        }
        function sendDoubleTap() {
          window.parent.postMessage({ type: 'hermes-double-tap' }, '*')
          if (model) {
            const specials = ['Flick3', 'Shake', 'Flick', 'FlickUp', 'FlickLeft']
            const pick = specials[Math.floor(Math.random() * specials.length)]
            model.motion(pick, undefined, window.PIXI.live2d.MotionPriority.NORMAL).catch(() => {})
          }
        }

        app.view.addEventListener('click', () => {
          const now = Date.now()
          if (now - lastClickTime < DOUBLE_CLICK_DELAY) {
            if (clickTimer) {
              clearTimeout(clickTimer)
              clickTimer = null
            }
            sendDoubleTap()
          } else {
            clickTimer = setTimeout(() => {
              clickTimer = null
              sendTap()
            }, DOUBLE_CLICK_DELAY + 50)
          }
          lastClickTime = now
        })

        try {
          log('Loading model...')
          model = await Live2DModel.from('/live2d/wanko/wanko_touch.model3.json')
          window.l2dModel = model
          log('Model loaded!')

          const cw = model.internalModel?.getCanvasWidth ? model.internalModel.getCanvasWidth() : 2
          const ch = model.internalModel?.getCanvasHeight ? model.internalModel.getCanvasHeight() : 2
          log('Canvas dims: ' + cw + 'x' + ch)
          log('Model bounds: ' + model.width + 'x' + model.height)

          let modelW = model.width
          let modelH = model.height
          if (modelW <= 0 || modelH <= 0 || modelW > 10000 || modelH > 10000) {
            modelW = cw
            modelH = ch
          }

          const scaleX = size / modelW
          const scaleY = size / modelH
          const scale = Math.max(scaleX, scaleY) * 2.3
          log('Scale: ' + scale.toFixed(3))

          model.scale.set(scale)
          model.anchor.set(0.5, 0.5)
          model.x = size / 2
          model.y = size / 2
          app.stage.addChild(model)
          log('Model added to stage')

          // Idle loop
          const playIdle = () => {
            if (!model) return
            model.motion('Idle', undefined, MotionPriority.IDLE)
              .catch(() => {})
              .then(() => setTimeout(playIdle, 3000 + Math.random() * 2000))
          }
          setTimeout(playIdle, 1000)

          // Initial mood
          playMood(currentMood)

          // Notify parent when ready
          window.parent.postMessage({ type: 'hermes-live2d-ready' }, '*')
        } catch (err) {
          log('ERROR: ' + err.message)
          console.error('Live2D load error:', err)
          window.parent.postMessage({ type: 'hermes-live2d-error', error: err.message }, '*')
        }
      }

      // Wait for Cubism Core to load
      if (window.Live2DCubismCore) {
        init()
      } else {
        let attempts = 0
        const checkInterval = setInterval(() => {
          if (window.Live2DCubismCore) {
            clearInterval(checkInterval)
            init()
          } else if (++attempts > 100) {
            clearInterval(checkInterval)
            console.error('Live2D Cubism Core failed to load')
          }
        }, 100)
      }

      // Listen for messages from parent
      window.addEventListener('message', (e) => {
        if (!e.data) return
        if (e.data.type === 'hermes-mood') {
          currentMood = e.data.mood
          playMood(currentMood)
        }
        if (e.data.type === 'hermes-tap') {
          if (model) {
            model.motion('Tap', undefined, window.PIXI.live2d.MotionPriority.NORMAL).catch(() => {})
          }
        }
        if (e.data.type === 'hermes-double-tap') {
          if (model) {
            const specials = ['Flick3', 'Shake', 'Flick', 'FlickUp', 'FlickLeft']
            const pick = specials[Math.floor(Math.random() * specials.length)]
            model.motion(pick, undefined, window.PIXI.live2d.MotionPriority.NORMAL).catch(() => {})
          }
        }
        if (e.data.type === 'hermes-mousemove' && model) {
          model.focus(e.data.x, e.data.y)
        }
      })

      // Mouse tracking
      window.addEventListener('mousemove', (e) => {
        if (!model) return
        const rect = container.getBoundingClientRect()
        const x = (e.clientX - rect.left) / rect.width * 2 - 1
        const y = (e.clientY - rect.top) / rect.height * 2 - 1
        model.focus(x, y)
      })

    })()
  </script>
</body>
</html>
