<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes 熊猫预览 V2 — 极简 Kakao 风格</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d4 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #1a1a2e;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 900px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card-label {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    .hero {
      margin-bottom: 30px;
    }
    .hero svg {
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.12));
    }
    .changelog {
      background: white;
      border-radius: 16px;
      padding: 20px 28px;
      margin-bottom: 30px;
      max-width: 600px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .changelog h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #1a1a2e;
    }
    .changelog ul {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: #555;
      line-height: 1.8;
    }
    .changelog li.done { color: #2a9d5c; }
    .changelog li.del { color: #c44; text-decoration: line-through; }
  </style>
</head>
<body>
  <h1>🐼 Hermes 熊猫预览 V2</h1>
  <p class="subtitle">极简 Kakao 风格 — 纯色 + 形状叠加（200px 放大展示）</p>

  <div class="changelog">
    <h3>📝 本次变更</h3>
    <ul>
      <li class="del">❌ SVG feTurbulence 毛绒滤镜（导致边缘扭曲）</li>
      <li class="del">❌ 所有径向渐变定义（视觉噪音）</li>
      <li class="done">✅ 经典熊猫多层大眼（眼圈+眼白+瞳孔+双高光）</li>
      <li class="done">✅ 圆润大头比例（头身比 2:1）</li>
      <li class="done">✅ 极简 3 色：纯白 / 深炭 #1a1a2e / 腮红粉</li>
      <li class="done">✅ 耳朵内凹细节 + 头部下方阴影</li>
    </ul>
  </div>

  <div class="hero" id="hero"></div>

  <div class="grid" id="grid"></div>

  <script>
    const S = 200;
    const moods = [
      { name: 'idle', label: '默认' },
      { name: 'happy', label: '开心' },
      { name: 'love', label: '爱心' },
      { name: 'surprised', label: '惊讶' },
      { name: 'sleepy', label: ' sleepy' },
      { name: 'thinking', label: '思考' },
      { name: 'angry', label: '生气' },
      { name: 'shy', label: '害羞' },
    ];

    function getBlush(mood) {
      switch(mood) {
        case 'love': case 'shy': return { o: 0.65, c: '255,140,160' };
        case 'angry': return { o: 0.5, c: '255,120,100' };
        case 'happy': return { o: 0.45, c: '255,160,170' };
        case 'sleepy': return { o: 0.2, c: '180,180,210' };
        default: return { o: 0.35, c: '255,170,180' };
      }
    }

    function renderEyes(s, mood, blinking) {
      const eyeY = s * 0.34, leftX = s * 0.37, rightX = s * 0.63, sz = s * 0.075;

      if (blinking || mood === 'sleepy') {
        return `
          <path d="M ${leftX - sz * 0.8} ${eyeY} Q ${leftX} ${eyeY + sz * 0.4} ${leftX + sz * 0.8} ${eyeY}"
            stroke="#1a1a2e" stroke-width="${s * 0.025}" fill="none" stroke-linecap="round" />
          <path d="M ${rightX - sz * 0.8} ${eyeY} Q ${rightX} ${eyeY + sz * 0.4} ${rightX + sz * 0.8} ${eyeY}"
            stroke="#1a1a2e" stroke-width="${s * 0.025}" fill="none" stroke-linecap="round" />
        `;
      }

      const normalEye = (cx, rot) => `
        <ellipse cx="${cx}" cy="${eyeY}" rx="${sz}" ry="${sz * 0.85}" fill="#1a1a2e" transform="rotate(${rot} ${cx} ${eyeY})" />
        <circle cx="${cx}" cy="${eyeY - sz * 0.05}" r="${sz * 0.55}" fill="#fff" />
        <circle cx="${cx - sz * 0.02}" cy="${eyeY + sz * 0.02}" r="${sz * 0.3}" fill="#0a0a14" />
        <circle cx="${cx + sz * 0.12}" cy="${eyeY - sz * 0.18}" r="${sz * 0.14}" fill="#fff" />
        <circle cx="${cx - sz * 0.1}" cy="${eyeY + sz * 0.1}" r="${sz * 0.07}" fill="#fff" opacity="0.7" />
      `;

      switch(mood) {
        case 'happy':
          return `
            <path d="M ${leftX - sz * 0.9} ${eyeY + sz * 0.25} Q ${leftX} ${eyeY - sz * 0.35} ${leftX + sz * 0.9} ${eyeY + sz * 0.25}"
              stroke="#1a1a2e" stroke-width="${s * 0.032}" fill="none" stroke-linecap="round" />
            <path d="M ${rightX - sz * 0.9} ${eyeY + sz * 0.25} Q ${rightX} ${eyeY - sz * 0.35} ${rightX + sz * 0.9} ${eyeY + sz * 0.25}"
              stroke="#1a1a2e" stroke-width="${s * 0.032}" fill="none" stroke-linecap="round" />
          `;
        case 'love': {
          const heart = cx => `<path d="M ${cx} ${eyeY + sz * 0.25} C ${cx - sz * 0.7} ${eyeY - sz * 0.3}, ${cx - sz * 0.7} ${eyeY + sz * 0.6}, ${cx} ${eyeY + sz * 0.25} C ${cx + sz * 0.7} ${eyeY + sz * 0.6}, ${cx + sz * 0.7} ${eyeY - sz * 0.3}, ${cx} ${eyeY + sz * 0.25}" fill="#E84A5F" />`;
          return heart(leftX) + heart(rightX);
        }
        case 'surprised':
          return `
            <ellipse cx="${leftX}" cy="${eyeY}" rx="${sz * 1.1}" ry="${sz}" fill="#1a1a2e" transform="rotate(-5 ${leftX} ${eyeY})" />
            <circle cx="${leftX}" cy="${eyeY - sz * 0.05}" r="${sz * 0.65}" fill="#fff" />
            <circle cx="${leftX}" cy="${eyeY}" r="${sz * 0.4}" fill="#0a0a14" />
            <circle cx="${leftX + sz * 0.15}" cy="${eyeY - sz * 0.2}" r="${sz * 0.18}" fill="#fff" />
            <ellipse cx="${rightX}" cy="${eyeY}" rx="${sz * 1.1}" ry="${sz}" fill="#1a1a2e" transform="rotate(5 ${rightX} ${eyeY})" />
            <circle cx="${rightX}" cy="${eyeY - sz * 0.05}" r="${sz * 0.65}" fill="#fff" />
            <circle cx="${rightX}" cy="${eyeY}" r="${sz * 0.4}" fill="#0a0a14" />
            <circle cx="${rightX + sz * 0.15}" cy="${eyeY - sz * 0.2}" r="${sz * 0.18}" fill="#fff" />
          `;
        case 'angry': {
          const angryEye = (cx, sx) => `
            <line x1="${cx - sx}" y1="${eyeY - sz * 0.6}" x2="${cx + sx * 0.35}" y2="${eyeY + sz * 0.2}"
              stroke="#1a1a2e" stroke-width="${s * 0.025}" stroke-linecap="round" />
            <ellipse cx="${cx}" cy="${eyeY + sz * 0.2}" rx="${sz * 0.6}" ry="${sz * 0.5}" fill="#1a1a2e" />
            <circle cx="${cx - sx * 0.15}" cy="${eyeY + sz * 0.1}" r="${sz * 0.2}" fill="#fff" />
          `;
          return angryEye(leftX, sz) + angryEye(rightX, -sz);
        }
        case 'thinking':
        case 'shy': {
          const thinkEye = (cx, rot, ry) => `
            <ellipse cx="${cx}" cy="${eyeY}" rx="${sz * 0.85}" ry="${sz * ry}" fill="#1a1a2e" transform="rotate(${rot} ${cx} ${eyeY})" />
            <circle cx="${cx}" cy="${eyeY - sz * 0.05}" r="${sz * 0.45}" fill="#fff" />
            <circle cx="${cx - sz * 0.05}" cy="${eyeY}" r="${sz * 0.25}" fill="#0a0a14" />
            <circle cx="${cx + sz * 0.1}" cy="${eyeY - sz * 0.15}" r="${sz * 0.12}" fill="#fff" />
          `;
          return thinkEye(leftX, -5, 0.55) + thinkEye(rightX, 5, 0.65);
        }
        default:
          return normalEye(leftX, -8) + normalEye(rightX, 8);
      }
    }

    function renderMouth(s, mood) {
      const mx = s * 0.50, my = s * 0.445, w = s * 0.12;
      switch(mood) {
        case 'happy': case 'love':
          return `<path d="M ${mx - w} ${my} Q ${mx} ${my + w * 1.3} ${mx + w} ${my}" stroke="#1a1a2e" stroke-width="${s * 0.022}" stroke-linecap="round" fill="none" />`;
        case 'surprised':
          return `<ellipse cx="${mx}" cy="${my + s * 0.01}" rx="${s * 0.022}" ry="${s * 0.032}" fill="#1a1a2e" />`;
        case 'thinking':
          return `<path d="M ${mx - w * 0.7} ${my + s * 0.01} Q ${mx} ${my - s * 0.01} ${mx + w * 0.7} ${my + s * 0.01}" stroke="#1a1a2e" stroke-width="${s * 0.018}" stroke-linecap="round" fill="none" />`;
        case 'angry':
          return `<path d="M ${mx - w * 0.8} ${my + s * 0.02} Q ${mx} ${my - s * 0.02} ${mx + w * 0.8} ${my + s * 0.02}" stroke="#1a1a2e" stroke-width="${s * 0.022}" stroke-linecap="round" fill="none" />`;
        case 'sleepy':
          return `<ellipse cx="${mx}" cy="${my}" rx="${s * 0.016}" ry="${s * 0.012}" fill="#1a1a2e" />`;
        case 'shy':
          return `<path d="M ${mx - w * 0.6} ${my + s * 0.005} Q ${mx} ${my + w * 0.5} ${mx + w * 0.6} ${my + s * 0.005}" stroke="#1a1a2e" stroke-width="${s * 0.018}" stroke-linecap="round" fill="none" />`;
        default:
          return `<path d="M ${mx - w} ${my} Q ${mx} ${my + w * 0.7} ${mx + w} ${my}" stroke="#1a1a2e" stroke-width="${s * 0.02}" stroke-linecap="round" fill="none" />`;
      }
    }

    function renderArms(s) {
      return `
        <ellipse cx="${s * 0.30}" cy="${s * 0.62}" rx="${s * 0.045}" ry="${s * 0.065}" fill="#1a1a2e" />
        <ellipse cx="${s * 0.70}" cy="${s * 0.62}" rx="${s * 0.045}" ry="${s * 0.065}" fill="#1a1a2e" />
      `;
    }

    function renderPanda(s, mood, blinking) {
      const b = getBlush(mood);
      return `
        <svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" style="filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));">
          <ellipse cx="${s * 0.5}" cy="${s * 0.92}" rx="${s * 0.26}" ry="${s * 0.035}" fill="rgba(0,0,0,0.07)" />

          <ellipse cx="${s * 0.37}" cy="${s * 0.80}" rx="${s * 0.065}" ry="${s * 0.05}" fill="#1a1a2e" />
          <ellipse cx="${s * 0.63}" cy="${s * 0.80}" rx="${s * 0.065}" ry="${s * 0.05}" fill="#1a1a2e" />

          <ellipse cx="${s * 0.5}" cy="${s * 0.58}" rx="${s * 0.21}" ry="${s * 0.14}" fill="#1a1a2e" />
          <ellipse cx="${s * 0.5}" cy="${s * 0.59}" rx="${s * 0.13}" ry="${s * 0.10}" fill="#faf8f5" />

          <ellipse cx="${s * 0.20}" cy="${s * 0.16}" rx="${s * 0.09}" ry="${s * 0.08}" fill="#1a1a2e" />
          <ellipse cx="${s * 0.20}" cy="${s * 0.17}" rx="${s * 0.055}" ry="${s * 0.045}" fill="#3d3d4a" />
          <ellipse cx="${s * 0.80}" cy="${s * 0.16}" rx="${s * 0.09}" ry="${s * 0.08}" fill="#1a1a2e" />
          <ellipse cx="${s * 0.80}" cy="${s * 0.17}" rx="${s * 0.055}" ry="${s * 0.045}" fill="#3d3d4a" />

          <ellipse cx="${s * 0.5}" cy="${s * 0.36}" rx="${s * 0.27}" ry="${s * 0.24}" fill="#fff" />
          <ellipse cx="${s * 0.5}" cy="${s * 0.52}" rx="${s * 0.20}" ry="${s * 0.06}" fill="#f0ece5" opacity="0.5" />

          ${renderEyes(s, mood, blinking)}

          <ellipse cx="${s * 0.50}" cy="${s * 0.435}" rx="${s * 0.032}" ry="${s * 0.022}" fill="#1a1a2e" />
          <ellipse cx="${s * 0.495}" cy="${s * 0.428}" rx="${s * 0.01}" ry="${s * 0.005}" fill="white" opacity="0.5" />

          ${renderMouth(s, mood)}

          <ellipse cx="${s * 0.25}" cy="${s * 0.405}" rx="${s * 0.055}" ry="${s * 0.035}" fill="rgba(${b.c},${b.o})" />
          <ellipse cx="${s * 0.75}" cy="${s * 0.405}" rx="${s * 0.055}" ry="${s * 0.035}" fill="rgba(${b.c},${b.o})" />

          ${renderArms(s)}
        </svg>
      `;
    }

    document.getElementById('hero').innerHTML = renderPanda(S, 'idle', false);

    const grid = document.getElementById('grid');
    moods.forEach(({name, label}) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = renderPanda(120, name, false) + `<div class="card-label">${label}</div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
